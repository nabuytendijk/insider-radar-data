name: Insider Radar data
on:
  schedule:
    - cron: "30 5 * * 1-5"   # elke werkdag, 05:30 UTC
  workflow_dispatch: {}       # handmatig starten via het tabblad Actions

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ophalen
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fetch_data.py
      - name: Opslaan
        run: |
          git config user.name "insider-radar"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data bijgewerkt"
          git push
